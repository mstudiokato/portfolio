# Netlify — wczesny deploy MVP na subdomenie *.netlify.app.
# Domeny michal-stezaly.pl NIE dotykamy aż do launchu (masterprompt sek. 12, Etap 10).

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# Oficjalny runtime Next.js dla Netlify (SSR/SSG, next/image, App Router).
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Nagłówki bezpieczeństwa (N2). CSP przepuszcza: własną domenę, Cloudflare
# Turnstile (challenges.cloudflare.com), Cloudflare Analytics
# (static.cloudflareinsights.com → beacon na cloudflareinsights.com) oraz
# 'unsafe-inline' dla stylów (Tailwind) i skryptów (hydracja Next.js).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-XSS-Protection = "1; mode=block"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://challenges.cloudflare.com https://cloudflareinsights.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
